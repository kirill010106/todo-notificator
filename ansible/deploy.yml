---
- name: Deploy ToDo Notificator
  hosts: webservers
  become: yes

  vars:
    app_dir: "/opt/todo-notificator"
    backup_dir: "/opt/todo-notificator-backups"

  tasks:
    - name: Require an immutable release version
      assert:
        that:
          - release_tag is defined
          - release_tag is match("^[0-9a-f]{40}$")

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Prune stale remote branches
      command: git remote prune origin
      args:
        chdir: "{{ app_dir }}"
      ignore_errors: yes

    - name: Clone/Pull repository
      git:
        repo: "https://github.com/kirill010106/todo-notificator.git" 
        dest: "{{ app_dir }}"
        version: "{{ release_tag }}"
        force: yes
    
    - name: Copy .env file to server
      copy:
        src: "../.env"      # Откуда: корень проекта в GitHub Actions
        dest: "{{ app_dir }}/.env" # Куда: на ваш сервер
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'      

    # Авторизуемся в реестре GitHub пакетов (необходим для приватных репозиториев)
    - name: Log in to GitHub Container Registry
      command:
        argv: [docker, login, ghcr.io, -u, "{{ github_username }}", --password-stdin]
        stdin: "{{ github_token }}"
      no_log: true

    - name: Install the release runtime
      package:
        name: python3
        state: present

    - name: Deploy with stopped writers and a verified database archive
      command:
        argv:
          - python3
          - "{{ app_dir }}/scripts/deploy_release.py"
          - --root
          - "{{ app_dir }}"
          - --backups
          - "{{ backup_dir }}"
      environment:
        IMAGE_BASE: "{{ image_base }}"
        IMAGE_TAG: "{{ release_tag }}"
