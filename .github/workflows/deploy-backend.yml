name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'notifiers/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/deploy-backend.yml'

# Гарантируем, что одновременно выполняется только один деплой
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/todo-notificator
  SERVER_HOST: 185.65.200.160
  # Свободные порты (заняты на сервере: 80 443 8081 2019)
  BACKEND_PORT: 8082
  NOTIFIER_PORT: 8086

jobs:
  # ─────────────────────────────────────────
  # 1. Тесты
  # ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Run backend tests
        run: go test ./backend/...

      - name: Run notifier tests
        run: go test ./notifiers/...

  # ─────────────────────────────────────────
  # 2. Сборка обоих бинарей
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: Build backend (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" \
            -o ./backend_bin \
            ./backend/cmd/

      - name: Build email notifier (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-s -w" \
            -o ./notifier_bin \
            ./notifiers/email/cmd/

      - name: Prepare notifier config artifact
        run: cp ./notifiers/email/config/config.yaml ./notifier_config.yaml

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            backend_bin
            notifier_bin
            notifier_config.yaml
          retention-days: 1

  # ─────────────────────────────────────────
  # 3. Деплой
  # ─────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Copy binaries to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend_bin,notifier_bin,notifier_config.yaml"
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            sudo systemctl stop backend        || true
            sudo systemctl stop email-notifier || true

            sudo mkdir -p ${{ env.DEPLOY_PATH }}/config

            sudo mv /tmp/backend_bin  ${{ env.DEPLOY_PATH }}/backend
            sudo mv /tmp/notifier_bin ${{ env.DEPLOY_PATH }}/email-notifier
            sudo chmod +x ${{ env.DEPLOY_PATH }}/backend
            sudo chmod +x ${{ env.DEPLOY_PATH }}/email-notifier

            # Обновляем notifier-конфиг при каждом деплое
            sudo cp /tmp/notifier_config.yaml ${{ env.DEPLOY_PATH }}/config/email-prod.yaml

            sudo systemctl start backend
            sudo systemctl start email-notifier

            sleep 2

            FAILED=()
            sudo systemctl is-active --quiet backend        || FAILED+=(backend)
            sudo systemctl is-active --quiet email-notifier || FAILED+=(email-notifier)

            if [ ${#FAILED[@]} -eq 0 ]; then
              echo "All services are running"
            else
              for svc in "${FAILED[@]}"; do
                echo "$svc failed to start:"
                sudo journalctl -u "$svc" -n 50 --no-pager
              done
              exit 1
            fi
