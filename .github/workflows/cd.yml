name: CD Pipeline (Build & Deploy)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  # Base image name
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ env.RELEASE_SHA }}

      - name: Build and push Email Notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notifiers/email/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-email:${{ env.RELEASE_SHA }}

      - name: Build and push Activity Logger
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./activity-logger/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-activity-logger:${{ env.RELEASE_SHA }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ env.RELEASE_SHA }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    # Деплой только если в репозитории явно выставлена переменная DEPLOY_ENABLED=true.
    # Пока переменной нет — джоб скипается и не красит коммиты красным.
    # Вернуть деплой: Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED=true
    if: vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Generate .env file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          umask 077
          printf '%s\n' "$PROD_ENV_FILE" > .env

      - name: Run Ansible Playbook
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "Skipping outdated release $RELEASE_SHA; main is $current_main"
            exit 0
          fi
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
          --extra-vars "ansible_host=${{ secrets.SERVER_IP }} ansible_user=${{ secrets.SERVER_USER }} github_username=${{ github.actor }} github_token=${{ secrets.GITHUB_TOKEN }} image_base=${{ env.IMAGE_BASE }} release_tag=${{ env.RELEASE_SHA }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
