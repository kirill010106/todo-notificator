name: CD Pipeline (Build & Deploy)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  # Base image name
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ env.RELEASE_SHA }}

      - name: Build and push Email Notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notifiers/email/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-email:${{ env.RELEASE_SHA }}

      - name: Build and push Activity Logger
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./activity-logger/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-activity-logger:${{ env.RELEASE_SHA }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ env.RELEASE_SHA }}

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    # Деплой только если в репозитории явно выставлена переменная DEPLOY_ENABLED=true.
    # Пока переменной нет — джоб скипается и не красит коммиты красным.
    # Вернуть деплой: Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED=true
    if: vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Validate deployment inputs
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os
          for name in ('SERVER_IP', 'SERVER_USER', 'PROD_ENV_FILE'):
              if not os.environ[name].strip():
                  raise SystemExit(f'Configure Actions secret {name}')
          for name in ('SERVER_IP', 'SERVER_USER'):
              value = os.environ[name]
              if value.startswith('-') or any(c.isspace() for c in value):
                  raise SystemExit(f'Invalid {name}: use a plain host or username')
          port = os.environ['SERVER_SSH_PORT']
          if not port.isdecimal() or not 1 <= int(port) <= 65535:
              raise SystemExit('SERVER_SSH_PORT must be a TCP port number')
          PY

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Add server to known_hosts
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 15 -p "$SERVER_SSH_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Generate .env file
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          umask 077
          printf '%s\n' "$PROD_ENV_FILE" > .env

      - name: Run Ansible Playbook
        run: |
          set -euo pipefail
          current_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo "Skipping outdated release $RELEASE_SHA; main is $current_main"
            exit 0
          fi
          umask 077
          python3 - <<'PY'
          import json, os
          values = {
              'ansible_host': os.environ['SERVER_IP'],
              'ansible_user': os.environ['SERVER_USER'],
              'ansible_port': int(os.environ['SERVER_SSH_PORT']),
              'github_username': os.environ['GITHUB_ACTOR'],
              'github_token': os.environ['REGISTRY_TOKEN'],
              'image_base': os.environ['IMAGE_BASE'],
              'release_tag': os.environ['RELEASE_SHA'],
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'deploy-vars.json'), 'w') as output:
              json.dump(values, output)
          PY
          trap 'rm -f "$RUNNER_TEMP/deploy-vars.json"' EXIT
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            --extra-vars "@$RUNNER_TEMP/deploy-vars.json"
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ vars.SERVER_SSH_PORT || '22' }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
