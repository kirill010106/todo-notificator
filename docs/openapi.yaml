      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                deadline:
                  type: string
                  format: date-time
                  nullable: true
                reminder_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: "Должно быть в будущем."
                category_id:
                  type: integer
                  format: int64
                  nullable: true
                  minimum: 1
                status:
                  type: string
                  enum:
                    - pending
                    - done
                    - burnt
      responses:
        "200":
          description: "Задача обновлена"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/TaskUpdatedResponse"
                  - $ref: "#/components/schemas/ActionResponse"
        "400":
          description: "Ошибка запроса"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Лимит 3 активных напоминаний бесплатного тарифа достигнут"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Задача или указанная категория не найдена либо принадлежит другому пользователю"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "Отсутствующее поле сохраняется. Явный null снимает deadline, reminder_at или category_id. Нужно хотя бы одно распознанное поле. Первое завершение дает 10 XP; reward_claimed сохраняется после повторного открытия. Изменение, награда и достижения атомарны. Ответ дополнен ActionResponse."
    delete:
      tags:
        - Tasks
      summary: "Удалить задачу"
      description: "Удаляет задачу текущего пользователя. Связанные активные Pomodoro-сессии переходят в abandoned с completed_at, без штрафа и изменения статистики. Все связанные сессии сохраняются как история с task_id=NULL. Завершение активных сессий и удаление задачи атомарны. Клиенту следует убрать удаленную задачу и остановить ее таймер после успешного ответа."
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "Задача удалена"
        "400":
          description: "Ошибка запроса"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Задача не найдена"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
