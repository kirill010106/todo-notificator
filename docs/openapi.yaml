openapi: 3.0.3
info:
  title: ToDo Notificator API
  description: API для управления задачами, категориями и уведомлениями
  version: 1.1.0
servers:
  - url: http://localhost:8082/api/v1
    description: Local backend

tags:
  - name: Auth
    description: Аутентификация и JWT
  - name: Tasks
    description: CRUD задач
  - name: Categories
    description: CRUD категорий пользователя
  - name: System
    description: Системные ручки

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: OK

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: Error
        error:
          type: string
          example: invalid request

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: Error
        error:
          type: string
          example: validation failed

    TokensResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 3600

    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        reminder_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, done]
        is_notified:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /login:
    post:
      tags: [Auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        "401":
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /refresh:
    post:
      tags: [Auth]
      summary: Обновление access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Токен обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        "401":
          description: Невалидный refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      responses:
        "200":
          description: Успешный logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        "401":
          description: Неавторизован

  /tasks:
    get:
      tags: [Tasks]
      summary: Список задач
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Список задач
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        "400":
          description: Ошибка параметров пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Неавторизован
        "404":
          description: Задачи не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Tasks]
      summary: Создать задачу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                deadline:
                  type: string
                  format: date-time
                  nullable: true
                reminder_at:
                  type: string
                  format: date-time
                  nullable: true
                category_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  id:
                    type: integer
                    format: int64
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Конфликт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{task_id}:
    patch:
      tags: [Tasks]
      summary: Обновить задачу
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                deadline:
                  type: string
                  format: date-time
                  nullable: true
                reminder_at:
                  type: string
                  format: date-time
                  nullable: true
                category_id:
                  type: integer
                  format: int64
                  nullable: true
                status:
                  type: string
                  enum: [pending, done]
      responses:
        "200":
          description: Задача обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  task_id:
                    type: integer
                    format: int64
        "400":
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Tasks]
      summary: Удалить задачу
      parameters:
        - in: path
          name: task_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Задача удалена
        "404":
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    get:
      tags: [Categories]
      summary: Список категорий пользователя
      responses:
        "200":
          description: Категории получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        "401":
          description: Неавторизован
    post:
      tags: [Categories]
      summary: Создать категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        "201":
          description: Категория создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  id:
                    type: integer
                    format: int64
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Категория уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{category_id}:
    patch:
      tags: [Categories]
      summary: Обновить категорию
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: Категория обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  category_id:
                    type: integer
                    format: int64
        "404":
          description: Категория не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Categories]
      summary: Удалить категорию
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Категория удалена
        "404":
          description: Категория не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
