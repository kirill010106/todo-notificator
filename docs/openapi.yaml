  /me/quests:
    get:
      tags:
        - Profile
      summary: "Ежедневные задания пользователя"
      description: "Возвращает текущий прогресс ежедневных заданий по календарному дню БД. Для задания pomodoro_focus учитываются только completed-сессии длительностью не менее 24 минут; abandoned и короткие сессии не учитываются. reward_xp содержит объявленную награду задания. Автоматическое начисление этой награды и отдельный метод ее получения пока не реализованы."
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestsResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/bulk-complete:
    post:
      tags:
        - Tasks
      summary: "Массово завершить задачи"
      description: "Обрабатываются задачи текущего пользователя со статусом, отличным от done: устанавливаются done и reward_claimed=true, очищается reminder_at, обновляется updated_at. Каждая задача, награда которой раньше не выдавалась, дает 10 очков. Уже награжденные задачи можно завершить без повторной награды. Чужие, несуществующие и уже завершенные задачи пропускаются; повторяющиеся ID учитываются один раз. Изменения всех выбранных задач, начисление очков, пересчет уровня и достижения сохраняются в одной транзакции. affected_count — число задач с измененным статусом, а не число наград. Повторные и параллельные запросы дополнительных наград не создают."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTasksRequest"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/BulkTasksResponse"
                  - $ref: "#/components/schemas/ActionResponse"
        "400":
          description: "Пустое тело, некорректный JSON или пустой task_ids"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
  /tasks/bulk-delete:
    post:
      tags:
        - Tasks
      summary: "Массово удалить задачи"
      description: "Удаляет только задачи текущего пользователя. Чужие и несуществующие ID пропускаются; повторяющиеся ID учитываются один раз. Связанные активные Pomodoro-сессии переходят в abandoned без штрафа. История сессий сохраняется с task_id=NULL. Удаление всех выбранных задач и завершение их активных сессий атомарны. affected_count — фактическое число удаленных задач."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTasksRequest"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTasksResponse"
        "400":
          description: "Пустое тело, некорректный JSON или пустой task_ids"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/create:
    post:
      tags:
        - Payments
      summary: "Создать платеж за Премиум"
      description: "Без тела запроса. Текущая сумма в обработчике: 49.00 RUB за Премиум навсегда. Возвращает URL подтверждения; сумма задается сервером. После оплаты используйте /payments/sync и обновите JWT для новых признаков тарифа."
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: "Необязательный ключ идемпотентности YooKassa; если не передан, сервер генерирует UUID. Текущий CORS не разрешает этот заголовок для запросов браузера с другого origin."
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreatedResponse"
        "401":
          description: Неавторизован
