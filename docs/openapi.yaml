            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "YooKassa не настроена"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/sync:
    post:
      tags:
        - Payments
      summary: "Проверить последний ожидающий платеж"
      description: "Без тела запроса. Сверяет платеж со шлюзом и выдает Премиум при succeeded. При отсутствии настроенного шлюза ожидающий платеж остается pending."
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSyncResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Не удалось проверить платеж в YooKassa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /webhooks/yookassa:
    post:
      tags:
        - Payments
      summary: "Уведомление YooKassa"
      security: []
      description: "Принимается с разрешенных IP YooKassa и loopback (127.0.0.1, ::1). Обрабатываются payment.succeeded и payment.canceled; прочие события подтверждаются без изменений. Успешный ответ не содержит тела. При настроенном шлюзе succeeded дополнительно проверяется через API YooKassa."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: notification
                event:
                  type: string
                  example: payment.succeeded
                object:
                  type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                  additionalProperties: true
      responses:
        "200":
          description: "Событие обработано или не требует действий; пустое тело"
        "400":
          description: "Некорректный JSON, платеж не найден или статус не подтвержден"
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: "IP не разрешен"
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: "Ошибка обновления платежа; пустое тело или text/plain"
        "502":
          description: "Ошибка проверки платежа"
          content:
            text/plain:
              schema:
                type: string
