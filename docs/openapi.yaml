  "/pomodoros/{id}/stop":
    post:
      tags:
        - Pomodoros
      summary: "Остановить pomodoro-сессию"
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - abandoned
                    - completed
                finish_task:
                  type: boolean
                  default: false
                  description: "Завершить связанную задачу (completed) или сжечь ее (abandoned). Для свободной сессии игнорируется."
      responses:
        "200":
          description: "Сессия завершена"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StatusResponse"
                  - $ref: "#/components/schemas/ActionResponse"
        "400":
          description: "Ошибка запроса"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Сессия отсутствует, уже завершена, принадлежит другому пользователю или ее задача недоступна"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      description: "Останавливает именно активную сессию с ID из URL, принадлежащую текущему пользователю. Повторная остановка завершенной сессии возвращает 404 и не меняет статистику. completed: длительность не менее 24 минут по времени БД дает 20 очков и увеличивает счетчики засчитанных Pomodoro. При finish_task=true связанная задача становится done и дополнительно дает 10 очков, если ее награда раньше не выдавалась. Полноценный Pomodoro с первым завершением задачи дает 30 базовых очков; достижения могут добавить бонусы. Короткая сессия не дает награды за Pomodoro и не увеличивает его счетчики. Явное первое завершение задачи при finish_task=true может дать обычные 10 очков за задачу. abandoned: сессия со связанной задачей штрафуется на 30 очков (итоговые очки не ниже нуля). При finish_task=true задача становится burnt; первый переход в burnt увеличивает счетчик сожженных задач и сбрасывает текущий стрик. Свободная сессия при abandoned сохраняется в истории без штрафа. Прерывание при удалении задачи также не штрафуется. Состояния сессии и задачи, статистика, уровень и достижения сохраняются в одной транзакции. Ответ не содержит обновленную статистику — ее нужно прочитать отдельно. Успех дополнен ActionResponse с реальными наградами, статистикой и следующим состоянием focus. Повтор с тем же Idempotency-Key возвращает прежний успех; без ключа повторная остановка остается 404."
