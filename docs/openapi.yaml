        - Profile
      summary: "Список достижений пользователя"
      description: "Возвращает достижения и проверяет доступность новых по серверным данным. Запись достижения и его бонус сохраняются атомарно, один раз. Бонус за достижение не продлевает стрик и не обновляет дату активности."
