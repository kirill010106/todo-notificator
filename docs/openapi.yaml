openapi: 3.0.3
info:
  title: "ToDo Notificator API"
  description: "API задач, категорий, Pomodoro, профиля, геймификации и платежей. Защищенные методы используют Authorization: Bearer <access_token>. Текущие Premium и подтверждение email проверяются по БД. Общий лимит: 100 запросов в минуту на IP; превышение возвращает JSON 429 и Retry-After. Ошибки, кроме webhook YooKassa, содержат code, message, request_id, field_errors; legacy error сохранен. Метрики доступны отдельно (:9091/metrics)."
  version: 1.3.0
servers:
  - url: "https://todoapi.chkpnk.ru/api/v1"
    description: Production
  - url: "http://localhost:8082/api/v1"
    description: "Local backend"
tags:
  - name: Auth
    description: "Аутентификация и JWT"
  - name: Tasks
    description: "CRUD задач"
  - name: Categories
    description: "CRUD категорий пользователя"
  - name: Stats
    description: "Статистика пользователя"
  - name: Pomodoros
    description: "Управление pomodoro-сессиями"
  - name: ActivityLogs
    description: "Лог активности пользователя"
  - name: System
    description: "Системные ручки"
  - name: Profile
    description: "Профиль, начальное состояние, достижения и ежедневные задания"
  - name: Payments
    description: "Премиум через YooKassa"
  - name: Dev
    description: "Методы, доступные только при ENV=local"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: Error
        error:
          type: string
          example: "invalid request"
        code:
          type: string
        validation_errors:
          type: object
          additionalProperties:
            type: string
        message:
          type: string
        request_id:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: string
    TokensResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          example: 900
          description: "Время жизни access token в секундах; локально 15 минут. Refresh token локально действует 168 часов."
    RegisterResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        user_id:
          type: integer
          format: int64
    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
        all_devices:
          type: boolean
          default: false
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        total:
          type: integer
          example: 42
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        reminder_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - pending
            - done
            - burnt
        is_notified:
          type: boolean
        pomodoros_taken:
          type: integer
          format: int64
        reward_claimed:
          type: boolean
          readOnly: true
          description: "Награда за завершение задачи уже выдана; управляется сервером и не сбрасывается при повторном открытии задачи."
      description: "category_id, deadline и reminder_at отсутствуют при nil; pomodoros_taken отсутствует при нулевом значении."
    TaskListResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        pagination:
          $ref: "#/components/schemas/Pagination"
    TaskCreatedResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        id:
          type: integer
          format: int64
    TaskUpdatedResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        task_id:
          type: integer
          format: int64
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
    CategoriesResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CategoryCreatedResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        id:
          type: integer
          format: int64
    CategoryUpdatedResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        category_id:
          type: integer
          format: int64
    UserStats:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        points:
          type: integer
          format: int64
          nullable: true
        level:
          type: integer
          format: int64
          nullable: true
        total_pomodoros:
          type: integer
          format: int64
          nullable: true
        total_burnt_tasks:
          type: integer
          format: int64
          nullable: true
        current_streak:
          type: integer
          format: int64
          nullable: true
        best_streak:
          type: integer
          format: int64
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        last_activity_date:
          type: string
          format: date-time
          description: "Отсутствует, если даты активности нет"
      description: "total_pomodoros, total_burnt_tasks, current_streak и best_streak могут отсутствовать при nil."
    UserStatsResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        user_stats:
          $ref: "#/components/schemas/UserStats"
    PomodoroSession:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        task_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum:
            - active
            - completed
            - abandoned
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_minutes:
          type: integer
          format: int64
        breaks_used:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
      description: "task_id отсутствует у свободной сессии и после удаления связанной задачи; breaks_used отсутствует при нулевом значении. Активная сессия при удалении задачи становится abandoned."
    PomodoroStartResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        session:
          $ref: "#/components/schemas/PomodoroSession"
    PomodoroActiveSessionConflictResponse:
      type: object
      properties:
        status:
          type: string
          example: Error
        error:
          type: string
          example: "pomodoro session is already active"
        active_session:
          $ref: "#/components/schemas/PomodoroSession"
    ActivityLog:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: integer
          format: int64
        action:
          type: string
          description: "Тип действия: TASK_CREATED, TASK_UPDATED, TASK_DELETED, CATEGORY_CREATED, CATEGORY_UPDATED, CATEGORY_DELETED, POMODORO_STARTED, POMODORO_STOPPED, POMODORO_PAUSED, POMODORO_ABANDONED_FREE, USER_REGISTERED, USER_LOGGED_IN"
        entity_id:
          type: integer
          format: int64
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
    ActivityLogsResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        logs:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
    APIError:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
        code:
          type: string
        request_id:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: string
      required:
        - status
        - message
        - code
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        is_verified:
          type: boolean
        is_premium:
          type: boolean
        categories_count:
          type: integer
          format: int64
        active_reminders_count:
          type: integer
          format: int64
        categories_limit:
          type: integer
          format: int64
          description: "3 для бесплатного тарифа, -1 для Премиум (без лимита)"
        reminders_limit:
          type: integer
          format: int64
          description: "3 для бесплатного тарифа, -1 для Премиум (без лимита)"
        timezone:
          type: string
          example: Europe/Moscow
          description: "IANA timezone. По умолчанию UTC; определяет день заданий, наград и серии."
    Achievement:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        code:
          type: string
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        points:
          type: integer
        unlocked:
          type: boolean
        unlocked_at:
          type: string
          format: date-time
          description: "Отсутствует у незаработанного достижения"
    DailyQuest:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        icon:
          type: string
        target:
          type: integer
        current:
          type: integer
        completed:
          type: boolean
        reward_xp:
          type: integer
        claimed:
          type: boolean
    GamificationProfile:
      type: object
      properties:
        level:
          type: integer
          format: int64
        points:
          type: integer
          format: int64
        current_level_xp:
          type: integer
          format: int64
        next_level_xp:
          type: integer
          format: int64
        progress_percent:
          type: number
          format: double
        rank_title:
          type: string
        rank_icon:
          type: string
        streak:
          type: integer
          format: int64
        best_streak:
          type: integer
          format: int64
        streak_multiplier:
          type: number
          format: double
        daily_quests:
          type: array
          items:
            $ref: "#/components/schemas/DailyQuest"
        unlocked_count:
          type: integer
        total_achievements:
          type: integer
        daily_chest_claimed:
          type: boolean
    ProfileResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        profile:
          $ref: "#/components/schemas/Profile"
    BootstrapResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        user:
          $ref: "#/components/schemas/Profile"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        pagination:
          $ref: "#/components/schemas/Pagination"
        stats:
          $ref: "#/components/schemas/UserStats"
        gamification:
          $ref: "#/components/schemas/GamificationProfile"
        active_pomodoro:
          $ref: "#/components/schemas/PomodoroSession"
        focus:
          $ref: "#/components/schemas/FocusState"
      description: "Добавлены user.timezone и focus. active_pomodoro сохранен для совместимости. Ошибка загрузки focus возвращает 500; остальные необязательные поля сохраняют прежнее поведение."
    AchievementsResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
    QuestsResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        quests:
          type: array
          items:
            $ref: "#/components/schemas/DailyQuest"
    BulkTasksRequest:
      type: object
      properties:
        task_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
      required:
        - task_ids
    BulkTasksResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        affected_count:
          type: integer
          format: int64
    PaymentCreatedResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        confirmation_url:
          type: string
          format: uri
    PremiumResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        is_premium:
          type: boolean
    PaymentSyncResponse:
      type: object
      properties:
        status:
          type: string
          example: OK
        is_premium:
          type: boolean
        payment_status:
          type: string
          description: "Статус шлюза (например pending, waiting_for_capture, succeeded, canceled) или not_found. Может отсутствовать, если Премиум уже активен или нет ожидающего платежа."
    FocusState:
      type: object
      properties:
        server_now:
          type: string
          format: date-time
        phase:
          type: string
          enum:
            - idle
            - focus
            - extra_break
            - recovery_break
        session:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PomodoroSession"
        phase_ends_at:
          type: string
          format: date-time
          nullable: true
        remaining_work_seconds:
          type: integer
          minimum: 0
          maximum: 1500
        completed_in_cycle:
          type: integer
          minimum: 0
          maximum: 3
        available_actions:
          type: array
          items:
            type: string
            enum:
              - start
              - resume
              - finish_rest
              - complete_session
              - complete_task
              - abandon
              - take_break
      description: "Авторитетное состояние фокуса. idle всегда 200. Дополнительный перерыв продолжается до 5 минут и не останавливает рабочие часы. Resume возвращает к той же сессии. После засчитанной сессии recovery_break 5 минут, после каждой четвертой — 15. Отдых сохраняется после истечения времени до resume или finish_rest; resume начинает следующую сессию. Время вычислять относительно server_now и пересчитывать при возвращении во вкладку."
    FocusResponse:
      type: object
      properties:
        status:
          type: string
        focus:
          $ref: "#/components/schemas/FocusState"
    ActionResult:
      type: object
      properties:
        pomodoro_counted:
          type: boolean
        task_completed:
          type: boolean
        changed_task_ids:
          type: array
          items:
            type: integer
            format: int64
        skipped_task_ids:
          type: array
          items:
            type: integer
            format: int64
    ActionRewards:
      type: object
      properties:
        task_xp:
          type: integer
        pomodoro_xp:
          type: integer
        achievement_xp:
          type: integer
        quest_xp:
          type: integer
        penalty_xp:
          type: integer
      description: "Фактические изменения XP операции; penalty_xp — положительная величина реально списанных очков. Дополнительные достижения отражены отдельно."
    ActionResponse:
      type: object
      properties:
        operation_id:
          type: string
        result:
          $ref: "#/components/schemas/ActionResult"
        rewards:
          $ref: "#/components/schemas/ActionRewards"
        stats:
          $ref: "#/components/schemas/UserStats"
        unlocked_achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        focus:
          $ref: "#/components/schemas/FocusState"
        task:
          $ref: "#/components/schemas/Task"
      description: "Дополняет прежние поля успешного ответа. task возвращается для одного фактически измененного ID. Все поля результата, статистики и фокуса сохранены в одной транзакции; повтор с тем же ключом возвращает сохраненный ответ, включая прежний server_now. Для актуального таймера после replay запросите /me/focus."
    TodayGroup:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        pagination:
          $ref: "#/components/schemas/Pagination"
    TodayState:
      type: object
      properties:
        server_now:
          type: string
          format: date-time
        timezone:
          type: string
        today:
          $ref: "#/components/schemas/TodayGroup"
        overdue:
          $ref: "#/components/schemas/TodayGroup"
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 128
      description: "Ключ уникален в пределах аккаунта. Повтор method + URI + того же JSON возвращает сохраненный успешный ответ без действия и наград. Другой запрос с тем же ключом: 409 IDEMPOTENCY_KEY_REUSED. JSON канонизируется; порядок полей неважен. Ошибки не кешируются. Ключи сейчас хранятся бессрочно. Для повтора после потери ответа сохраняйте тот же ключ."
security:
  - bearerAuth: []
paths:
  /register:
    post:
      tags:
        - Auth
      summary: "Регистрация пользователя"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: "Успешная регистрация"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: "Ошибка валидации"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Пользователь уже существует"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: "Пользователь создан, но сервис отправки письма недоступен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /login:
    post:
      tags:
        - Auth
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: "Успешный вход"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
        "400":
          description: "Ошибка запроса"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Неверные учетные данные"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /refresh:
    post:
      tags:
        - Auth
      summary: "Обновление access token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: "Токены обновлены"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResponse"
        "400":
          description: "Ошибка запроса"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Невалидный refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /verify:
    get:
      tags:
        - Auth
      summary: "Подтверждение email"
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Email подтвержден"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          description: "Неверный или просроченный токен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /logout:
    post:
      tags:
        - Auth
      summary: "Выход из системы"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: "Успешный logout"
        "400":
          description: "Ошибка запроса"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Внутренняя ошибка сервера"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks:
    get:
      tags:
        - Tasks
      summary: "Список задач"
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
          description: "Положительное число; значения выше 100 ограничиваются до 100."
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: status
          description: "Фильтр по статусу задачи"
          schema:
            type: string
            enum:
              - all
              - pending
              - done
              - burnt
            default: all
        - in: query
          name: search
          description: "Поиск по title и description (case-insensitive)"
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: integer
            format: int64
          description: "Фильтр категории"
        - in: query
          name: sort_by
          schema:
            type: string
            default: created_at
          description: "created_at или deadline; неизвестное значение использует created_at DESC"
        - in: query
          name: order
          schema:
            type: string
          description: "asc или desc (без учета регистра). По умолчанию created_at DESC, deadline ASC; deadline без даты идут последними. order применяется при переданном sort_by."
        - in: query
          name: deadline_from
          schema:
            type: string
            format: date-time
          description: "Включительная граница RFC3339"
        - in: query
          name: deadline_before
          schema:
            type: string
            format: date-time
          description: "Исключительная граница RFC3339"
        - in: query
          name: has_deadline
          schema:
            type: boolean
          description: "Наличие срока. false несовместим с границами дат. from должен быть раньше before."
