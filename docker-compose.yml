version: '3.8'

services:
  # MONGO FOR PRODUCTION (or use external)
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - default
    # ports:
    #  - "27017:27017" # disable external access to prod mongo for safety

  activity-logger:
    image: ${IMAGE_BASE}-activity-logger:${IMAGE_TAG:?set IMAGE_TAG to the release SHA}
    restart: always
    depends_on:
      mongo:
        condition: service_started
    environment:
      - MONGO_URL=mongodb://mongo:27017
    networks:
      - default

  backend:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    image: ${IMAGE_BASE}-backend:${IMAGE_TAG:?set IMAGE_TAG to the release SHA}
    restart: always
    depends_on:
      - activity-logger
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CONFIG_PATH=/app/config/prod.yaml
      - AUTO_MIGRATE=false
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:?set trusted Traefik IPs or CIDRs}
    env_file:
      - .env
    volumes:
      - ./backend/config:/app/config:ro
    # Подключаем к внешней сети Traefik:
    networks:
      - default
      - matrix-traefik-net

    # Убедитесь, что вы убрали секцию ports, так как Traefik всё берет на себя
    # ports:
    #  - "8082:8082" 

    labels:
      - "traefik.enable=true"
      # Настраиваем роутинг:
      - "traefik.http.routers.todobackend.rule=Host(`todoapi.chkpnk.ru`)"
      # ВАЖНО: точка входа называется web-secure, а не websecure
      - "traefik.http.routers.todobackend.entrypoints=web-secure"
      # ВАЖНО: обязательно включаем TLS явно
      - "traefik.http.routers.todobackend.tls=true"
      # ВАЖНО: certResolver пишется с большой буквой R в конфигурации Matrix
      - "traefik.http.routers.todobackend.tls.certResolver=default"
      # Указываем правильный порт из prod.yaml
      - "traefik.http.services.todobackend.loadbalancer.server.port=8082"
      # Явно указываем сеть:
      - "traefik.docker.network=traefik"

  email-notifier:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    image: ${IMAGE_BASE}-email:${IMAGE_TAG:?set IMAGE_TAG to the release SHA}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # ВАЖНО: Указываем путь к конфигу email
      - EMAIL_CONFIG_PATH=/app/config/prod.yaml
    env_file:
      - .env
    volumes:
      # Пробрасываем локальные конфиги воркера в папку /app/config внутри контейнера
      - ./notifiers/email/config:/app/config:ro

  frontend:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    image: ${IMAGE_BASE}-frontend:${IMAGE_TAG:?set IMAGE_TAG to the release SHA}
    restart: always
    networks:
      - default
      - matrix-traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.todofrontend.rule=Host(`todo.chkpnk.ru`)"
      - "traefik.http.routers.todofrontend.entrypoints=web-secure"
      - "traefik.http.routers.todofrontend.tls=true"
      - "traefik.http.routers.todofrontend.tls.certResolver=default"
      - "traefik.http.services.todofrontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
  db-tools:
    image: ${POSTGRES_TOOLS_IMAGE:-postgres:16-alpine}
    profiles: ["tools"]
    environment:
      - DATABASE_URL=${DATABASE_URL}

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
    - "3001:3000"
    volumes:
    - grafana_data:/var/lib/grafana
    - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro


# Регистрируем внешнюю сеть Traefik
networks:
  matrix-traefik-net:
    external: true
    name: traefik
volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
